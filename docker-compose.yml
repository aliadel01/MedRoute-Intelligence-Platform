networks:
  streaming-net:
    driver: bridge

volumes:
  redpanda-data:
  postgres-data:
  grafana-data:

services:
  # --- Redpanda Broker (Kafka Alternative) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr=plaintext://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=plaintext://redpanda-0:29092,external://localhost:9092
    environment:
      - name=value
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
    networks:
      - streaming-net

  # --- Redpanda Console (The Web UI) ---
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh -c "sleep 5 && /app/console"
    environment:
      - KAFKA_BROKERS=redpanda-0:29092
    ports:
      - "8080:8080"
    networks:
      - streaming-net
    depends_on:
      - redpanda


  # --- Debezium Kafka Connect ---
  kafka-connect:
    image: debezium/connect:2.7.0.Final 
    container_name: medroute_debezium
    ports:
      - "8083:8083"                     
    environment:
      BOOTSTRAP_SERVERS: redpanda-0:29092
      GROUP_ID: medroute-connect-cluster  
      # These three topics store connector state, offsets, and config, Kafka Connect creates them automatically
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      # Replication factor — set to 1 for single-broker dev setups
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Event output format — JSON without schema envelope is simplest to consume
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"     # removes the "schema" wrapper from events
    networks:
      - streaming-net
    depends_on:
      - redpanda
      - console
      - postgres


  # --- Python Incident Simulator ---
  python-incident-simulator:
    build:
      context: ./src/simulators/incident
      dockerfile: Dockerfile
    container_name: python-simulator
    command: python incident_simulator.py
    networks:
      - streaming-net
    depends_on:
      - redpanda

  # --- PostGIS Database ---
  postgres:
    image: postgis/postgis:15-3.3
    container_name: medroute_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=medroute_pass
      - POSTGRES_DB=medroute_db
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
      -c wal_keep_size=1024
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - streaming-net

  # --- pgAdmin (Database Web UI) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medroute_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@medroute.com
      - PGADMIN_DEFAULT_PASSWORD=admin_pass
    ports:
      - "5050:80"
    networks:
      - streaming-net
    depends_on:
      - postgres

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - streaming-net
    depends_on:
      - redpanda 
    environment: 
      - GF_SECURITY_ADMIN_PASSWORD=admin 
    volumes:
      - grafana-data:/var/lib/grafana

  # --- Valhalla Routing Engine ---
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: medroute_valhalla
    environment:
      # Tell Valhalla to build tiles from this OSM file on first start
      - use_tiles_ignore_pbf=False
      - build_tar=True
      # Traffic tile directory — Valhalla watches this for live updates
      - traffic_dir=/data/traffic
      # Tile cache refresh interval in seconds
      - tile_update_interval=5
    volumes:
      # Your NYC OSM extract — Valhalla builds routing tiles from this
      - ./data/valhalla:/custom_files
      # Traffic tile hot-folder — your fetcher writes here
      - ./data/traffic:/data/traffic
    ports:
      - "8002:8002"
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # --- Traffic Fetcher ---
  # traffic_fetcher:
  #   build:
  #     context: ./src/simulators/traffic
  #     dockerfile: Dockerfile.traffic
  #   volumes:
  #     - ./data/traffic:/data/traffic 
  #     - ./data/nyc_to_valhalla_mapping.csv:/data/nyc_to_valhalla_mapping.csv
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   depends_on:
  #     valhalla:
  #       condition: service_healthy
  #   networks:
  #     - streaming-net

  # --- Apache Spark ---
  dispatch-engine:
    image: apache/spark:3.5.1-python3
    build:
      context: ./src/decision_engine
      dockerfile: Dockerfile
    container_name: medroute_dispatch_engine
    user: root
    restart: unless-stopped
    volumes:
      - ./src/decision_engine:/opt/spark/jobs
      - ./src/decision_engine/checkpoints:/opt/spark/checkpoints
    networks:
      - streaming-net
    depends_on:
      - redpanda
      - console
      - postgres
      - valhalla
      - pgadmin
      - python-incident-simulator

  # --- ICU Changes Simulator ---
  icu-sim:
    build:
      context: ./src/simulators/hospitals
      dockerfile: Dockerfile
    container_name: icu-simulator
    command: python icu_sim.py
    networks:
      - streaming-net
    depends_on:
      - postgres

  # --- Apache Spark Job for Hospitals OLAP Sync ---
  hospitals-olap-sync-engine:
    image: apache/spark:3.5.1-python3
    build:
      context: ./src/decision_engine
      dockerfile: Dockerfile
    container_name: medroute_hospitals_olap_sync
    user: root
    restart: unless-stopped
    command: ["python3", "/opt/spark/jobs/hospitals_cdc_to_olap.py"]
    volumes:
      - ./src/decision_engine:/opt/spark/jobs
      - ./src/decision_engine/checkpoints:/opt/spark/checkpoints
    networks:
      - streaming-net
    depends_on:
      - redpanda
      - kafka-connect
      - postgres
      - icu-sim