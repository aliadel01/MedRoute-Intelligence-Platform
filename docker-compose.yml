
networks:
  streaming-net:
    driver: bridge

volumes:
  redpanda-data:
  postgres-data:
  grafana-data:

services:
  # --- Redpanda Broker (Kafka Alternative) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr=plaintext://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=plaintext://redpanda-0:29092,external://localhost:9092
    environment:
      - name=value
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
    networks:
      - streaming-net

  # --- Redpanda Console (The Web UI) ---
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh -c "sleep 5 && /app/console"
    environment:
      - KAFKA_BROKERS=redpanda-0:29092
    ports:
      - "8080:8080"
    networks:
      - streaming-net
    depends_on:
      - redpanda

  kafka-connect:
    image: debezium/connect:2.7.0.Final 
    container_name: medroute_debezium
    ports:
      - "8083:8083"                     
    environment:
      BOOTSTRAP_SERVERS: redpanda-0:29092
      GROUP_ID: medroute-connect-cluster  
      # These three topics store connector state, offsets, and config, Kafka Connect creates them automatically
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      # Replication factor — set to 1 for single-broker dev setups
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Event output format — JSON without schema envelope is simplest to consume
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"     # removes the "schema" wrapper from events
    networks:
      - streaming-net
    depends_on:
      - redpanda
      - postgres


  # --- Python Incident Simulator ---
  python-incident-simulator:
    build:
      context: ./simulator/incident-simulator
      dockerfile: Dockerfile
    container_name: python-simulator
    command: python incident_simulator.py
    networks:
      - streaming-net
    depends_on:
      - redpanda

  # --- PostGIS Database ---
  postgres:
    image: postgis/postgis:15-3.3
    container_name: medroute_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=medroute_pass
      - POSTGRES_DB=medroute_db
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
      -c wal_keep_size=1024
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - streaming-net

  # --- pgAdmin (Database Web UI) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medroute_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@medroute.com
      - PGADMIN_DEFAULT_PASSWORD=admin_pass
    ports:
      - "5050:80"
    networks:
      - streaming-net
    depends_on:
      - postgres

  # --- OSRM Routing Engine ---
  osrm:
    image: osrm/osrm-backend:latest
    container_name: medroute_osrm
    # Note: Replace 'region.osrm' with your actual preprocessed .osrm filename
    command: osrm-routed --algorithm mld /data/nyc-roads.osrm
    volumes:
      - ./simulator/routing/data:/data   # Maps a local folder containing your preprocessed map data
    ports:
      - "5000:5000"
    networks:
      - streaming-net


  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - streaming-net
    depends_on:
      - redpanda 
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin 
    volumes:
    - grafana-data:/var/lib/grafana

  # --- Apache Spark ---
  dispatch-engine:
    image: apache/spark:3.5.1-python3
    build:
      context: ./decision_engine
      dockerfile: Dockerfile
    container_name: medroute_dispatch_engine
    user: root
    restart: unless-stopped
    volumes:
      - ./decision_engine:/opt/spark/jobs
      - ./checkpoints:/opt/spark/checkpoints
      - ./decision_engine/medroute_engine.log:/app/medroute_engine.log
    networks:
      - streaming-net
    depends_on:
      - redpanda
      - postgres
      - osrm